<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090C">
<title>My TV Time</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Fonts load without blocking: until they arrive, system fonts stand in. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..800&family=Instrument+Serif:ital@0;1&display=swap" media="print" onload="this.media='all'">
  <style>
    html,body{background:#07080A;color:#F3F4F6;margin:0}
    /* The loading screen is plain HTML and CSS, so it shows on the very first
       frame — even if every script after it is slow or stuck. */
    #boot{position:fixed;inset:0;z-index:9000;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:14px;background:radial-gradient(circle at 50% 0%,#1A1D24 0%,#050505 70%);font:500 14px/1.4 system-ui,sans-serif;color:#9AA0AA}
    #boot b{font:800 26px/1 system-ui,sans-serif;color:#F3F4F6;letter-spacing:-.02em}
    #boot .bar{width:120px;height:3px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden}
    #boot .bar i{display:block;width:40%;height:100%;border-radius:9px;background:#8FA8FF;animation:bootbar 1.1s ease-in-out infinite}
    @keyframes bootbar{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
    #boot .more{display:none;max-width:300px;text-align:center;font-size:12px;color:#7A808A}
    #boot.slow .more{display:block}
    #boot button{margin-top:6px;padding:10px 22px;border-radius:999px;border:0;background:#F3F4F6;color:#08090B;font:700 14px system-ui,sans-serif}
    @media (prefers-reduced-motion:reduce){#boot .bar i{animation:none;width:100%}}
  </style>
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>

<!-- First-run setup. Keys live in this browser only, never in the repo. -->
<section id="setup" hidden>
  <div class="setup-card">
    <h1 class="setup-title">Connect your library</h1>
    <p class="setup-sub">These keys stay on this device. They are never sent
       anywhere except Supabase and TMDB, and never stored in the code.</p>
    <label>Supabase URL
      <input id="cfg-url" type="url" placeholder="https://xxxx.supabase.co" autocomplete="off">
    </label>
    <label>Supabase anon key
      <input id="cfg-key" type="password" placeholder="eyJhbGci..." autocomplete="off">
    </label>
    <label>TMDB API key
      <input id="cfg-tmdb" type="password" placeholder="TMDB v3 key" autocomplete="off">
    </label>
    <label>Football key <em>(optional)</em>
      <input id="cfg-football" type="password" placeholder="football-data.org token" autocomplete="off">
    </label>
    <button id="cfg-save" class="btn-primary">Connect</button>
    <p id="cfg-error" class="setup-error" hidden></p>
  </div>
</section>

<!-- Main app -->
<main id="app" hidden>
  <div id="view" class="view"></div>

  <nav id="tabbar" role="tablist">
    <button role="tab" data-view="next" aria-selected="true"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg><span>Watching</span></button>
    <button role="tab" data-view="soon" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 2.8v4M16 2.8v4"/></svg><span>Upcoming</span></button>
    <button role="tab" data-view="search" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.6-4.6"/></svg><span>Discover</span></button>
    <button role="tab" data-view="library" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg><span>Library</span></button>
    <button role="tab" data-view="me" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20.5c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span>You</span></button>
  </nav>
</main>

<!-- Detail sheet -->
<div id="sheet-backdrop" hidden></div>
<section id="sheet" hidden aria-modal="true" role="dialog">
  <button id="sheet-close" aria-label="Close">✕</button>
  <div id="sheet-body"></div>
</section>

<div id="toast" hidden></div>
<pre id="fatal" hidden></pre>
<div id="boot" role="status" aria-live="polite">
  <b>My TV Time</b>
  <div class="bar"><i></i></div>
  <div id="boot-step">Starting…</div>
  <div class="more"><div id="boot-why">This is taking longer than usual — probably a slow connection.</div>
    <button onclick="location.reload()">Reload</button></div>
</div>

<script>
// Belt and braces: remove any service worker still registered, even if the
// browser never fetches the new sw.js. A bad worker used to survive a
// reinstall and keep the app on its splash screen.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(rs => rs.forEach(r => r.unregister()))
    .catch(function () {});
  if (window.caches) {
    caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(function () {});
  }
}
</script>
<script>
// A blank page means a script never ran. Show the reason instead of nothing.
/* The red box exists to explain a BLANK screen — the app failing to start.
   Once the app is running, a stray rejection (a skipped animation, an aborted
   request) is not a crash, and the app reports real problems itself, such as
   a failed save. So after boot these go to the console, not over your screen.
   The box can also be tapped away. */
function showFatal(text) {
  var box = document.getElementById('fatal');
  if (!box) return;
  box.hidden = false;
  box.textContent = text + '  (tap to dismiss)';
  box.onclick = function () { box.hidden = true; };
}
function benign(err) {
  var name = err && err.name, msg = String((err && err.message) || err || '');
  return name === 'AbortError' || name === 'InvalidStateError'
      || /transition|viewport|aborted/i.test(msg);
}
window.addEventListener('error', function (e) {
  if (window.__mytvBooted) { console.warn('[mytv]', e.message); return; }
  showFatal('Load error: ' + (e.message || e.type) +
    (e.filename ? '  [' + e.filename.split('/').pop() + ':' + e.lineno + ']' : ''));
});
window.addEventListener('unhandledrejection', function (e) {
  var r = e.reason;
  if (benign(r)) { e.preventDefault && e.preventDefault(); return; }
  if (window.__mytvBooted) { console.warn('[mytv]', r); return; }
  showFatal('Error: ' + (r && r.message ? r.message : r));
});
</script>
<script>
/* ===================================================================
   LOADER (v2)

   Startup used to be four network trips in single file — Google Fonts
   (which blocked every script below it), then the version check (up to
   4s), then styles, and only then app.js — with a blank screen
   throughout. On a phone whose connection is just waking up, that could
   sit blank for a long time, and the watchdog couldn't even start.

   Now: fonts never block; the app starts at once with the version this
   phone already knows; app.js downloads in parallel with the styles; and
   the update check runs alongside. If it finds a newer build in the first
   few seconds, the page reloads into it — otherwise the app offers it.
   Every step is timestamped on the phone, so a stall leaves evidence.
   =================================================================== */
(function () {
  var KEY = 'mytv.ver', LOG = 'mytv.bootlog', t0 = Date.now(), steps = [];
  var TEXT = { html: 'Starting…', styles: 'Loading the app…', script: 'Opening your library…', version: 'Checking for updates…' };

  // Did the previous launch stall before painting? Keep its log for the app to report.
  try {
    var prev = JSON.parse(localStorage.getItem(LOG) || 'null');
    if (prev && prev.steps && !prev.steps.some(function (x) { return x[0] === 'painted'; })) window.__prevBootStall = prev;
  } catch (e) {}

  function mark(step) {
    steps.push([step, Date.now() - t0]);
    try { localStorage.setItem(LOG, JSON.stringify({ at: t0, steps: steps })); } catch (e) {}
    var el = document.getElementById('boot-step');
    if (el && TEXT[step]) el.textContent = TEXT[step];
  }
  window.__bootMark = mark;
  mark('html');

  var known = '';
  try { known = localStorage.getItem(KEY) || ''; } catch (e) {}
  var started = false;

  function load(v) {
    if (started) return;
    started = true;
    window.__mytvVersion = v;
    var q = '?v=' + encodeURIComponent(v);
    // Start downloading the app now, in parallel with the styles.
    var pre = document.createElement('link');
    pre.rel = 'preload'; pre.as = 'script'; pre.href = 'app.js' + q;
    document.head.appendChild(pre);
    var go = false;
    function startApp() {
      if (go) return; go = true;
      mark('styles');
      var js = document.createElement('script');
      js.src = 'app.js' + q;
      js.onload = function () { mark('script'); };
      js.onerror = function () {
        var w = document.getElementById('boot-why'), b = document.getElementById('boot');
        if (w) w.textContent = 'Could not download the app (version ' + v + '). Check your connection.';
        if (b) b.className = 'slow';
      };
      document.body.appendChild(js);
    }
    var css = document.createElement('link');
    css.rel = 'stylesheet'; css.href = 'styles.css' + q;
    css.onload = startApp; css.onerror = startApp;   // a styling failure must never stop the app
    setTimeout(startApp, 2500);                         // nor a stylesheet that never answers
    document.head.appendChild(css);
  }

  // Start immediately with the version this phone knows.
  if (known) load(known);

  var ctrl = ('AbortController' in window) ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, 4000);
  fetch('version.json?t=' + Date.now(), { cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (j) {
      clearTimeout(timer);
      mark('version');
      var v = (j && j.v) ? String(j.v) : '';
      if (!v) { if (!known) load('fallback'); return; }
      try { localStorage.setItem(KEY, v); } catch (e) {}
      if (!known) { load(v); return; }
      if (v !== known) {
        // A newer build exists. Early on, just switch to it; once you're
        // using the app, offer it rather than yank the screen away.
        if (Date.now() - t0 < 6000 && !window.__mytvInteracted) location.reload();
        else { window.__mytvUpdate = v; try { window.dispatchEvent(new Event('mytv-update')); } catch (e) {} }
      }
    })
    .catch(function () { clearTimeout(timer); if (!known) load('fallback'); });
})();
</script>
<script>
// The loading screen removes ITSELF as soon as the app or setup screen is
// visible. It must not depend on app.js doing it: on the launch after an
// update, the phone first runs its cached older app.js, which has never heard
// of this screen and would leave it covering everything.
var __bootWatch = setInterval(function () {
  var b = document.getElementById('boot');
  if (!b || !b.parentNode) { clearInterval(__bootWatch); return; }
  var app = document.getElementById('app'), setup = document.getElementById('setup');
  if ((app && !app.hidden) || (setup && !setup.hidden)) { b.parentNode.removeChild(b); clearInterval(__bootWatch); }
}, 250);

// Escalating watchdog: after 6 seconds the loading screen explains itself and
// offers Reload; after 20 it names the step it is stuck on.
setTimeout(function () {
  var b = document.getElementById('boot'); if (b && b.parentNode) b.className = 'slow';
}, 6000);
setTimeout(function () {
  var b = document.getElementById('boot'), w = document.getElementById('boot-why');
  if (!b || !b.parentNode || !w) return;
  try {
    var log = JSON.parse(localStorage.getItem('mytv.bootlog') || '{}');
    var last = (log.steps || []).slice(-1)[0];
    if (last) w.textContent = 'Still waiting after "' + last[0] + '" (' + Math.round(last[1] / 1000) + 's in). Reload usually fixes a slow connection.';
  } catch (e) {}
}, 20000);
</script>
</body>
</html>
